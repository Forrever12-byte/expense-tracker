<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dist/output.css">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body class="bg-black text-white p-5">
    <h1 class="text-3xl font-semibold mb-8">Expense Tracker</h1>

    <form id="form" class="flex flex-col gap-4">
        <div class="flex flex-col gap-2">
            <label for="expenseName" class="mb-2 text-white/80">Expense</label>
            <input type="text" id="expenseName" name="expenseName" placeholder="Enter Expense Name" class="px-3 py-2 border border-white/50 rounded-lg">
        </div>

        <div class="flex gap-3 justify-between w-full">

            <div class="flex flex-col w-[50%]">
                <label for="expenseAmount" class="mb-2 text-white/80">Amount</label>
                <input type="number" id="expenseAmount" name="expenseAmount" placeholder="Enter Amount" class="px-3 py-2 border border-white/50 rounded-lg">
            </div>

            <!-- Categories -->
            <div class="flex flex-col w-[50%]">
                <label for="categories" class="mb-2 text-white/80">Category</label>
                <select name="categories" id="categories" class="px-3 py-2 border border-white/50 rounded-lg">
                    <option value="feeding" class="bg-black">Feeding</option>
                    <option value="transportation" class="bg-black">Transportation</option>
                    <option value="internet" class="bg-black">Internet</option>
                    <option value="rent" class="bg-black">Rent</option>
                    <option value="miscellaneous" class="bg-black">Miscellaneous</option>
                </select>
            </div>

        </div>

        <button id="addExpense" class="py-2 bg-white text-black rounded-lg font-semibold mb-5">Add Expense</button>
    </form>

    <!-- Filter -->
    <select name="filter" id="filter" class="px-3 py-2 border border-white/50 rounded-lg">
        <option value="all" class="bg-black">All</option>
        <option value="feeding" class="bg-black">Feeding</option>
        <option value="transportation" class="bg-black">Transportation</option>
        <option value="internet" class="bg-black">Internet</option>
        <option value="rent" class="bg-black">Rent</option>
        <option value="miscellaneous" class="bg-black">Miscellaneous</option>
    </select>

    <ul id="list" class="mt-15">

    </ul>

    <p id="total"></p>

    <script src="index.js"></script>
</body>
</html>
